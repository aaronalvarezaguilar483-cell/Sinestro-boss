name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q -o sinestro_boss.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Compilar
        working-directory: proyecto/sinestro_boss
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sinestro_boss
          path: proyecto/sinestro_boss/build/libs/*.jar
